<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora Científica Inteligente</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="light-mode">
  <header>
    <h1>Calculadora Científica</h1>
    <button id="toggleMode">Modo Oscuro/Claro</button>
    <button id="toggleMusic">Música</button>
    <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="0.5">
  </header>

  <main>
    <div class="calculator">
      <div class="display" id="display">0</div>
      <div class="buttons">
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button onclick="appendValue('/')">/</button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button onclick="appendValue('*')">*</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button onclick="appendValue('-')">-</button>

        <button onclick="appendValue('0')">0</button>
        <button onclick="appendValue('.')">.</button>
        <button onclick="calculate()">=</button>
        <button onclick="appendValue('+')">+</button>

        <button onclick="appendValue('Math.sin(')">sin</button>
        <button onclick="appendValue('Math.cos(')">cos</button>
        <button onclick="appendValue('Math.tan(')">tan</button>
        <button onclick="appendValue('Math.sqrt(')">√</button>

        <button onclick="clearDisplay()">C</button>
        <button onclick="showHistory()">Historial</button>
      </div>
    </div>

    <div class="history" id="history"></div>
  </main>

  <footer>
    <p>&copy; 2025 EEST N.° 1 Eduardo Ader</p>
  </footer>

  <audio id="clickSound" src="click.mp3"></audio>
  <audio id="bgMusic" src="music.mp3" loop></audio>
  <script src="script.js"></script>
</body>

</html>
